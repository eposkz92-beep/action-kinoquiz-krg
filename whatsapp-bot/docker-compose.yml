services:
  kinoquiz-bot:
    build: .
    container_name: action-kinoquiz-bot
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - TIMEZONE=Asia/Almaty
      - PORT=3000
      - QR_PORT=3000
    env_file:
      - .env
    volumes:
      - ./auth_info_baileys:/app/auth_info_baileys
      - ./data:/app/data
      - ./exports:/app/exports
      - ../instagram_state.json:/instagram_state.json:ro
